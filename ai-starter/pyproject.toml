[tool.ruff]
target-version = "py39"
line-length = 110
extend-exclude = [".venv", "runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"] # FastAPI's File(...) declaration is intentionally an endpoint default.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
